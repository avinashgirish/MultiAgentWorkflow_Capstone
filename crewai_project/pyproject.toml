[project]
name = "market-gtm-crew"
version = "0.1.0"
description = "Multi-agent market research & GTM planning crew (Head Analyst + Research/Analyst/GTM agents), with CLI and Streamlit interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai[azure-ai-inference,google-genai]>=0.165.1",
    "crewai-tools[mcp,serpapi]>=0.62.3",
    "fastmcp>=2.11.3",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "python-dotenv>=1.0.1",
    "streamlit>=1.48.1",
    "tavily-python>=0.7.11",
]
